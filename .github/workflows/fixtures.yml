name: fixtures

# Real-artifact CI: downloads the actual T8030 (iPhone 11) firmware pieces
# from Apple's CDN + captures a real TSS ticket from gs.apple.com, caches
# them, and runs the whole test suite against the REAL bytes (the
# "real-KC / real-ADT / real-TSS gates" from PARITY.md).

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_fixtures.py"
      - "tools/remote_zip_pull.py"
      - ".github/workflows/fixtures.yml"
      - "crates/**"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # weekly: refresh fixtures + TSS signing status

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real Apple fixtures (range-request partial IPSW + live TSS)
        run: python3 tools/fetch_fixtures.py fixtures
      - name: Upload fixtures artifact
        uses: actions/upload-artifact@v4
        with:
          name: t8030-fixtures
          path: fixtures/
          retention-days: 30
          if-no-files-found: error

  test-real:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: t8030-fixtures
          path: fixtures
      - name: Run full suite against REAL Apple bytes
        run: IOS_RUST_FIXTURES=$PWD/fixtures cargo test --all -- --nocapture
      - name: Parity ledger gate
        run: cargo run --quiet -- parity
