name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tool: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            tool: cross
          - os: macos-latest
            target: aarch64-apple-darwin
            tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.tool == 'cross'
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.tool }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package (single binary: ios-rust)
        run: |
          DIR=ios-rust-${{ matrix.target }}
          mkdir -p "$DIR"
          cp target/${{ matrix.target }}/release/ios-rust "$DIR"/
          cp README.md PARITY.md LICENSE "$DIR"/
          if [ "${{ runner.os }}" = "Linux" ]; then strip "$DIR"/ios-rust || true; fi
          tar czf "$DIR".tar.gz "$DIR"
          shasum -a 256 "$DIR".tar.gz > "$DIR".tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ios-rust-*.tar.gz
            ios-rust-*.tar.gz.sha256
