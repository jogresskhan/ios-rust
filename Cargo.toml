[workspace]
resolver = "2"
members = [
    "crates/qemu-util",
    "crates/soc-t8030",
    "crates/devices",
    "crates/virt",
    "crates/ipsw",
    "crates/vault",
    "crates/vm-core",
    "crates/a13-cpu",
    "crates/adt",
    "crates/img4",
    "crates/macho",
    "crates/apple-soc",
    "crates/restore",
    "crates/sandbox",
    "crates/gui",
    "crates/dsc",
    "crates/kernelcache",
    "crates/devices-db",
    "crates/vuln-db",
    "crates/devicecheck",
    "crates/xnu",
    "crates/host-linux",
    "crates/ios-rust",
    "crates/plist",
    "crates/usbmux",
    "crates/asr",
    "crates/restored",
    "crates/authinstall",
    "crates/apfs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["jogresskhan"]
repository = "https://github.com/jogresskhan/ios-rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time"] }
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
aes-gcm = "0.10"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
