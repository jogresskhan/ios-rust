[workspace]
resolver = "2"
members = [
    "crates/qemu-util",
    "crates/soc-t8030",
    "crates/devices",
    "crates/virt",
    "crates/ipsw",
    "crates/vault",
    "crates/ios-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["20kiwy"]
repository = "https://github.com/20kiwy/ios-rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time"] }
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
